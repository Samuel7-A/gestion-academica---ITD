# Proyecto académico: solo datos sintéticos; confirmar secretos y permisos antes de publicar.
services:
  - type: web
    name: gestion-academica-api-demo
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /api/v1/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: gestion-academica-frontend-demo
    runtime: static
    buildCommand: cd Frontend && npm ci && node scripts/write-public-api.cjs && npm run build
    staticPublishPath: ./Frontend/dist/Frontend/browser
    envVars:
      - key: ITD_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
