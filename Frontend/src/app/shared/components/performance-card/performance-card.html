<div class="performance-row">
  <div class="col-period"><span class="period-title">{{ periodName }}</span></div>
  <div class="col-type"><span class="mobile-label">Actividad:</span><span>{{ activityType }}</span></div>
  <div class="col-date"><span class="mobile-label">Último registro:</span><span class="text-slate">{{ date }}</span></div>
  <div class="col-grade"><span class="mobile-label">Promedio:</span><span class="grade-value" [class.empty-grade]="grade === '—'">{{ grade }}</span></div>
  <div class="col-weight"><span class="mobile-label">Calificados:</span><span class="text-slate">{{ weight }}</span></div>
  <div class="col-status">
    <span class="status-badge" [ngClass]="{
      'badge-approved': status === 'Con notas',
      'badge-review': status === 'Sin notas'
    }">{{ status }}</span>
  </div>
</div>
