<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Gestión Académica</h2>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <app-custom-input
          label="Usuario"
          type="email"
          formControlName="usuario"
          placeholder="docnete@ie.edu.pe"
          ></app-custom-input>

      </div>

      <div class="form-group">
        <app-custom-input
          label="contraseña"
          type="password"
          placeholder="sebitas123"
          formControlName="password"
          ></app-custom-input>

      </div>
      <p>{{mensajeError}}</p>

      <div class="form-actions">
        <app-custom-button 
          text="Iniciar Sesion"
          type="submit"
          [disabled]="loginForm.invalid"
          ></app-custom-button>
        <app-custom-button
          text="Registrarse"
          type="button"
          (clicked)="onRegister()"
          ></app-custom-button>
      </div>
    </form>
  </div>
</div>
