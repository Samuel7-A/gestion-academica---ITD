<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2>Gestión Académica</h2>
      <p>Ingresa Datos Personales</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="primerNombre">Primer Nombre</label>
        <input 
          id="primerNombre" 
          type="text" 
          formControlName="primerNombre" 
          placeholder="Marcelino"
        />
      </div>

      <div class="form-group">
        <label for="apellidos">Apellidos</label>
        <input 
          id="apellidos" 
          type="text" 
          formControlName="apellidos" 
          placeholder="Rojas de la Cruz"
        />
      </div>

      <div class="form-group">
        <label for="telefono">Numero Telefono</label>
        <input 
          id="telefono" 
          type="tel" 
          formControlName="telefono" 
          placeholder="952 152 154"
        />
      </div>

      <div class="form-group">
        <label>Especialidades</label>
        <div class="especialidades-box">
          <button 
            type="button" 
            *ngFor="let esp of especialidadesList"
            class="pill-btn"
            [class.active]="isEspecialidadSelected(esp)"
            (click)="toggleEspecialidad(esp)"
          >
            {{ esp }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="correo">Correo</label>
        <input 
          id="correo" 
          type="email" 
          formControlName="correo" 
          placeholder="soy_Docente.pro@gmail.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
        />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Registrarse</button>
        <button type="button" class="btn btn-secondary" (click)="onLoginRedirect()">Iniciar Sesion</button>
      </div>
    </form>
  </div>
</div>
