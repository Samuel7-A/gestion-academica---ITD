<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2>Gestión Académica</h2>
      <p>Ingresa Datos Personales</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <app-custom-input label="Primer Nombre" type="text" formControlName="primerNombre"
          placeholder="Marcelino"></app-custom-input>
      </div>

      <div class="form-group">
        <app-custom-input label="Apellidos" text="Apellidos" type="text" formControlName="apellidos"
          placeholder="Rojas de la Cruz"></app-custom-input>
      </div>

      <div class="form-group">
        <app-custom-input label="Numero Telefono" type="tel" formControlName="telefono"
          placeholder="952 152 154"></app-custom-input>
      </div>

      <div class="form-group">
        <label>Especialidades</label>
        <div class="especialidades-box">
          @for (esp of especialidadesList; track $index) {
          <button type="button" class="pill-btn" [class.active]="isEspecialidadSelected(esp)"
            (click)="toggleEspecialidad(esp)">
            {{ esp.nombre }}
          </button>
          }
        </div>
      </div>

      <app-custom-input
        label="Correo"
        type="email"
        formControlName="correo"
        placeholder="soy_Docente.pro@gmail.com"
        ></app-custom-input>
      <app-custom-input
        label="Contraseña"
        type="password"
        placeholder="sebitasPro385"
        formControlName="password"
        ></app-custom-input>
      <div class="form-actions">
        <app-custom-button text="Registrarse" type="submit" [disabled]="registerForm.invalid"></app-custom-button>
        <app-custom-button text="Iniciar Sesion" (clicked)="onLoginRedirect()"></app-custom-button>
      </div>

    </form>
  </div>
</div>
