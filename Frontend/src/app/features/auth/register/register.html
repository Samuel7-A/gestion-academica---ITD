<div class="register-container"><div class="register-card">
  <div class="register-header"><h2>Registro de docentes</h2><p>Solo con invitación de un administrador.</p></div>
  @if(error()){<p class="form-error" role="alert">{{error()}}</p>}
  @if(success()){<p class="form-success" role="status">{{success()}}</p><button class="btn btn-primary" type="button" (click)="onLoginRedirect()">Ir al login</button>}
  @else {
   <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group"><label for="reg-name">Nombre completo</label><input id="reg-name" formControlName="full_name" autocomplete="name" maxlength="150" required></div>
    <div class="form-group"><label for="reg-email">Correo</label><input id="reg-email" type="email" formControlName="email" autocomplete="email" required></div>
    <div class="form-group"><label for="reg-invite">Código de invitación</label><input id="reg-invite" formControlName="invite_token" autocomplete="off" required></div>
    <div class="form-group"><label for="reg-pass">Contraseña (12 caracteres o más)</label><input id="reg-pass" type="password" formControlName="password" autocomplete="new-password" required></div>
    <div class="form-group"><label for="reg-confirm">Confirmar contraseña</label><input id="reg-confirm" type="password" formControlName="confirm_password" autocomplete="new-password" required></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary" [disabled]="busy()||registerForm.invalid">{{busy()?'Registrando…':'Crear cuenta'}}</button>
    <button type="button" class="btn btn-secondary" (click)="onLoginRedirect()">Tengo una cuenta</button></div>
   </form>
  }
  <p class="register-note">Prototipo educativo: no introducir datos personales reales de estudiantes.</p>
</div></div>
