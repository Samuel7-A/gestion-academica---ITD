<div class="app-layout">

  <main class="main-content">

    <div class="dashboard-grid">
      <!-- Sección Izquierda: Cursos -->
      <section class="courses-section">
        <div class="section-header">
          <h1>Mis cursos</h1>
          <p>Bienvenido, Docente</p>
        </div>

        <div class="courses-grid">
        @for (course of courses; track $index) {
          <app-course-card 
            [courseName]="course.name"
            [studentsCount]="course.students"
            (cardClick)="onSelectCurse()"
            ></app-course-card>
        }
        </div>
      </section>

      <!-- Sección Derecha: Actividades Semanales -->
      <aside class="activities-sidebar">
        <div class="activities-card">
          <h2>Actividades Semanales</h2>
          <div class="activities-list">

            @for (item of activities; track $index) {
              <app-schedule-card
                [badgeText]="item.type"
                [title]="item.title"
                [time]="item.day"
                [description]="item.detail"
                >
                </app-schedule-card>
            }


          </div>
        </div>
      </aside>
    </div>
  </main>
</div>
