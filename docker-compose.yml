# Entorno de ejecución del APF3.
#   docker compose up --build
# API: http://localhost:8000/docs
#
# Por defecto usa un PostgreSQL local (servicio "db").
# Para usar Supabase, define DATABASE_URL en el archivo .env (ver .env.example).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apf3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apf3}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_academica}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-apf3}:${POSTGRES_PASSWORD:-apf3}@db:5432/${POSTGRES_DB:-gestion_academica}}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Espacio para el frontend Angular (Sebastián), cuando tenga su Dockerfile:
  # frontend:
  #   build: ./Frontend
  #   ports:
  #     - "4200:80"
  #   depends_on:
  #     - backend

volumes:
  pgdata:
