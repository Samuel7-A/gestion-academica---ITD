name: Validación integral ITD
on:
  pull_request:
  push:
    branches: ['feature/cierre-integral-itd','release/proyecto-final']
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Backend/requirements-dev.txt -r Backend/ml/requirements.txt
      - run: python -m pytest -q --disable-warnings
        working-directory: Backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      - run: npx vitest run
        working-directory: Frontend
      - run: npm run build
        working-directory: Frontend
