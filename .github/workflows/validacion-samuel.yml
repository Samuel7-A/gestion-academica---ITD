name: Validación ML y estadísticas

on:
  push:
    branches: [main, App-Angular, 'feature/estadisticas-ml-samuel-final']
  pull_request:

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/ml/requirements.txt
      - name: Instalar dependencias del backend y ML
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Backend/requirements-dev.txt -r Backend/ml/requirements.txt
      - name: Probar backend y modelos ML
        working-directory: Backend
        run: python -m pytest -q

  angular-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Instalar dependencias frontend
        working-directory: Frontend
        run: npm ci
      - name: Prueba unitaria de estadísticas
        working-directory: Frontend
        run: npx vitest run src/app/features/pages/grades-performance/grades-analytics.spec.ts
      - name: Compilar Angular
        working-directory: Frontend
        run: npm run build
